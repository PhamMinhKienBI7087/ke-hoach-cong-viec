<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Kế hoạch công việc · Phạm Minh Kiên</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%23176b42'/%3E%3Cpath d='M12 25l7 7 15-16' fill='none' stroke='%23fff' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M34 15c4-1 7 1 7 1s-1 5-5 6c-3 1-5-1-5-1s0-5 3-6z' fill='%23e8c35a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Lexend:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Trang chỉ để xem. Dữ liệu nằm trong tasks.json, do Claude cập nhật qua GitHub.
   Bố cục: banner ảnh lớp học + chuỗi xoắn kép → Lộ trình → lời nhắc → các tab.
   Màu riêng: xanh lá cây theo banner của thầy, điểm vàng kim cho việc quan trọng. */
:root {
  --bg: #f1f6f2;
  --surface: #ffffff;
  --ink: #12231a;
  --muted: #5a6b61;
  --line: #d6e3da;
  --accent: #17744a;
  --accent-deep: #0e4d30;
  --accent-soft: #e0f1e7;
  --done: #2a9a5c;
  --done-soft: #def3e6;
  --todo: #9a6a12;
  --todo-soft: #faefd6;
  --bad: #c0392b;
  --bad-soft: #fbe3df;
  --gold: #b88a1e;
  --gold-soft: #fbf1d6;
  --fixed: #ecf1ee;
  --fixed-ink: #5d6f64;
  --on-accent: #ffffff;
  --heat0: #e4ece6; --heat1: #bfe3cc; --heat2: #84c9a0; --heat3: #3fa36c; --heat4: #17744a;
  --font-display: "Lexend", "Be Vietnam Pro", system-ui, sans-serif;
  --font-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 12px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b1510; --surface: #122019; --ink: #e5efe8; --muted: #95aa9c; --line: #24392d;
    --accent: #4fc583; --accent-deep: #0e4d30; --accent-soft: #163626; --done: #4fc583; --done-soft: #153522;
    --todo: #e2ab52; --todo-soft: #352912; --bad: #f2796a; --bad-soft: #3b1e1a; --gold: #e8c35a; --gold-soft: #3a3014;
    --fixed: #1a2b21; --fixed-ink: #a0b4a7; --on-accent: #06140c;
    --heat0: #1b2b22; --heat1: #1f4d33; --heat2: #2b7a4c; --heat3: #3fab6c; --heat4: #6fe09f;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 0 16px 40px; display: grid; gap: 14px; }

/* ---------- Banner ---------- */
.hero { position: relative; overflow: hidden; color: #fff; background: linear-gradient(180deg, #258d58 0%, #1c7b49 45%, #135c35 100%); }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,0) 40%, rgba(6,40,22,.35) 100%); pointer-events: none; }
.hero-photo { position: absolute; left: 0; top: 0; bottom: 0; width: min(560px, 46%); background: url("img/hero.webp") 78% 18% / cover no-repeat;
  -webkit-mask-image: linear-gradient(90deg, #000 72%, transparent 100%); mask-image: linear-gradient(90deg, #000 72%, transparent 100%); }
#helix { position: absolute; top: 0; right: 0; height: 100%; width: 30%; opacity: .6; pointer-events: none; z-index: 1;
  -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 35%); mask-image: linear-gradient(90deg, transparent 0%, #000 35%); }
.hero-in { position: relative; z-index: 2; max-width: 1280px; margin: 0 auto; padding: 30px 16px 26px calc(min(560px, 46%) + 8px); min-height: 280px; display: grid; align-content: center; gap: 14px; }
.brandline { display: flex; align-items: center; gap: 14px; }
.logo { width: 54px; height: 54px; border-radius: 15px; background: rgba(255,255,255,.14); display: grid; place-items: center; box-shadow: inset 0 0 0 1px rgba(255,255,255,.3); flex: none; }
.logo svg { width: 36px; height: 36px; }
.hero h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(26px, 3.4vw, 40px); margin: 0; letter-spacing: -.015em; line-height: 1.1; text-wrap: balance; }
.hero h1 em { font-style: normal; color: #f3d77e; }
.hero .who { font-size: 14px; opacity: .9; margin-top: 4px; }
.hero .today { font-size: 13px; opacity: .85; }
.stats { display: flex; flex-wrap: wrap; gap: 8px; }
.stat { background: rgba(8,50,28,.35); box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); border-radius: 12px; padding: 8px 12px; min-width: 108px; }
.stat b { display: block; font-family: var(--font-mono); font-size: 20px; font-weight: 500; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; opacity: .88; }
@media (max-width: 820px) {
  .hero-photo { width: 100%; height: 230px; bottom: auto; background-position: 74% 14%; -webkit-mask-image: linear-gradient(180deg, #000 60%, transparent 100%); mask-image: linear-gradient(180deg, #000 60%, transparent 100%); }
  #helix { display: none; }
  .hero-in { padding: 190px 16px 20px; min-height: 0; }
}

/* ---------- Lộ trình ---------- */
.road { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px 12px; margin-top: 14px; }
.road h2 { font-family: var(--font-display); font-size: 15px; margin: 0 0 12px; display: flex; gap: 8px; align-items: baseline; }
.road h2 span { font-family: var(--font-body); font-weight: 400; font-size: 12px; color: var(--muted); }
.track { list-style: none; margin: 0; padding: 0; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(120px, 1fr); gap: 0; overflow-x: auto; }
.ms { position: relative; padding: 0 8px 4px; text-align: center; display: grid; justify-items: center; align-content: start; gap: 6px; }
.ms::before { content: ""; position: absolute; top: 13px; left: 0; right: 0; height: 3px; background: var(--line); z-index: 0; }
.ms:first-child::before { left: 50%; } .ms:last-child::before { right: 50%; }
.ms.done::before, .ms.current::before { background: var(--done); }
.ms.current::before { background: linear-gradient(90deg, var(--done) 50%, var(--line) 50%); }
.ms .dot { position: relative; z-index: 1; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 3px solid var(--line); }
.ms.done .dot { background: var(--done); border-color: var(--done); }
.ms.done .dot svg { width: 14px; height: 14px; stroke: #fff; stroke-width: 3; fill: none; }
.ms.current .dot { border-color: var(--gold); box-shadow: 0 0 0 5px var(--gold-soft); }
.ms.current .dot::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--gold); }
.ms.dream .dot { border-color: var(--gold); }
.ms.dream .dot::after { content: "★"; color: var(--gold); font-size: 13px; line-height: 1; }
.ms .mt { font-size: 13px; font-weight: 600; line-height: 1.3; max-width: 170px; }
.ms.next .mt { color: var(--muted); font-weight: 500; }
.ms.current .mt { color: var(--ink); }
.ms .mw { font-size: 12px; color: var(--muted); }
.ms.current .mw { color: var(--gold); font-weight: 600; }
.ms .mg { font-size: 11px; color: var(--accent); }
@media (prefers-reduced-motion: no-preference) { .ms.current .dot { animation: pulse 2.4s ease-in-out infinite; } }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 4px var(--gold-soft); } 50% { box-shadow: 0 0 0 9px var(--gold-soft); } }
@media (max-width: 760px) {
  .track { grid-auto-flow: row; grid-auto-columns: auto; }
  .ms { grid-template-columns: 28px 1fr; justify-items: start; text-align: left; column-gap: 12px; padding: 0 0 14px; }
  .ms .dot { grid-row: span 3; }
  .ms::before { top: 0; bottom: 0; left: 12px; right: auto; width: 3px; height: auto; }
  .ms:first-child::before { left: 12px; top: 14px; } .ms:last-child::before { right: auto; bottom: calc(100% - 14px); }
  .ms.current::before { background: linear-gradient(180deg, var(--done) 50%, var(--line) 50%); }
  .ms .mt { max-width: none; }
}

/* ---------- Thanh tab, lời nhắc ---------- */
.tabs { display: inline-flex; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 3px; gap: 2px; justify-self: start; }
.tabs button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; color: var(--muted); font-weight: 500; }
.tabs button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.remind { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
.remind .lbl { font-family: var(--font-display); font-weight: 600; font-size: 14px; margin-right: 4px; }
.rchip { border: 1px solid transparent; border-radius: 999px; padding: 4px 12px; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; background: transparent; }
.rchip b { font-family: var(--font-mono); font-weight: 500; }
.rchip.bad { background: var(--bad-soft); color: var(--bad); }
.rchip.todo { background: var(--todo-soft); color: var(--todo); }
.rchip.star { background: var(--gold-soft); color: var(--gold); }
.rchip:hover { border-color: currentColor; }
.remind .calm { font-size: 13px; color: var(--muted); }
.status { font-size: 12px; color: var(--muted); margin-left: auto; }
.status.err { color: var(--bad); }

.navbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.navbar .period { font-family: var(--font-display); font-weight: 600; font-size: 20px; flex: 1 1 200px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; }
.btn:hover { border-color: var(--accent); }
.btn.icon { width: 36px; padding: 6px 0; text-align: center; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 14px; align-items: start; }
@media (max-width: 980px) { .layout { grid-template-columns: 1fr; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }
.sec-h { font-family: var(--font-display); font-size: 16px; margin: 0 0 10px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.sec-h span { font-family: var(--font-body); font-weight: 400; font-size: 12px; color: var(--muted); }

/* ---------- Lịch tháng ---------- */
.grid7 { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.dow { font-size: 12px; font-weight: 600; color: var(--muted); text-align: center; padding: 2px 0 4px; }
.cell { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px; min-height: 112px; text-align: left; display: flex; flex-direction: column; gap: 4px; }
.cell:hover { border-color: var(--accent); }
.cell.out { opacity: .5; }
.cell.sel { border-color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); }
.cell .d { font-family: var(--font-mono); font-size: 13px; display: flex; justify-content: space-between; gap: 4px; align-items: center; }
.cell.today .d b { background: var(--accent); color: var(--on-accent); border-radius: 999px; padding: 0 7px; font-weight: 500; }
.fx { display: block; font-family: var(--font-body); font-size: 10px; line-height: 1.3; color: var(--fixed-ink); background: var(--fixed); border-radius: 4px; padding: 1px 4px; margin-top: 2px; overflow-wrap: anywhere; }
.fx.off, .fxb.off { text-decoration: line-through; opacity: .6; }
.fxb .ofl { margin-left: 4px; font-size: 10px; font-weight: 600; text-decoration: none; display: inline-block; }
.ev { display: block; font-size: 12px; line-height: 1.3; padding: 2px 6px; border-radius: 5px; border-left: 3px solid var(--todo); background: var(--todo-soft); overflow-wrap: anywhere; }
.ev.done { border-left-color: var(--done); background: var(--done-soft); color: var(--muted); text-decoration: line-through; }
.ev.late { border-left-color: var(--bad); background: var(--bad-soft); }
.ev .tm { font-family: var(--font-mono); font-size: 11px; margin-right: 4px; }
.st { color: var(--gold); margin-right: 3px; }
.more { font-size: 12px; color: var(--accent); font-weight: 500; }
.dots { display: none; gap: 3px; flex-wrap: wrap; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--todo); }
.dots i.done { background: var(--done); } .dots i.late { background: var(--bad); }
@media (max-width: 640px) {
  .grid7 { gap: 3px; }
  .cell { min-height: 58px; padding: 4px; }
  .cell .ev, .cell .more, .cell .fx { display: none; }
  .cell .dots { display: flex; }
}
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 10px; align-items: center; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.lg-todo::before { background: var(--todo); } .lg-done::before { background: var(--done); } .lg-late::before { background: var(--bad); } .lg-fix::before { background: var(--fixed); box-shadow: inset 0 0 0 1px var(--line); }
.legend .lg-star::before { display: none; }

/* ---------- Tuần ---------- */
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.wcol { border: 1px solid var(--line); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 5px; min-height: 280px; text-align: left; background: var(--surface); }
.wcol:hover { border-color: var(--accent); }
.wcol.sel { border-color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); }
.wcol .wh { display: grid; margin-bottom: 2px; }
.wcol .wh b { font-family: var(--font-display); font-size: 14px; }
.wcol .wh span { font-size: 12px; color: var(--muted); font-family: var(--font-mono); }
.wcol.today .wh b { color: var(--accent); }
.fxb { display: block; font-size: 11px; line-height: 1.3; color: var(--fixed-ink); background: var(--fixed); border-radius: 5px; padding: 3px 6px; }
.fxb .tm { font-family: var(--font-mono); }
@media (max-width: 760px) { .week { grid-template-columns: 1fr; } .wcol { min-height: 0; } }

/* ---------- Năm: nhịp làm việc + 12 tháng ---------- */
.heat-wrap { overflow-x: auto; padding-bottom: 4px; }
.heat { display: grid; grid-template-rows: 16px repeat(7, 12px); grid-auto-flow: column; grid-auto-columns: 12px; gap: 3px; width: max-content; }
.heat .ml { font-size: 10px; color: var(--muted); grid-row: 1; white-space: nowrap; }
.heat i { width: 12px; height: 12px; border-radius: 3px; background: var(--heat0); display: block; }
.heat i.l1 { background: var(--heat1); } .heat i.l2 { background: var(--heat2); } .heat i.l3 { background: var(--heat3); } .heat i.l4 { background: var(--heat4); }
.heat i.pad { background: transparent; }
.heat i.today { outline: 1.5px solid var(--gold); outline-offset: 1px; }
.heat-row { display: grid; grid-template-columns: auto 1fr; gap: 8px; }
.heat-days { display: grid; grid-template-rows: 16px repeat(7, 12px); gap: 3px; font-size: 10px; color: var(--muted); line-height: 12px; }
.heat-legend { display: flex; gap: 4px; align-items: center; font-size: 12px; color: var(--muted); margin-top: 8px; flex-wrap: wrap; }
.heat-legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.heat-note { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
.heat-note b { color: var(--ink); font-family: var(--font-mono); font-weight: 500; }
.year { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; margin-top: 14px; }
.mcard { border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: var(--surface); }
.mcard .mh { border: 0; background: transparent; padding: 0 0 6px; font-family: var(--font-display); font-weight: 600; width: 100%; text-align: left; display: flex; justify-content: space-between; }
.mcard .mh span { font-family: var(--font-body); font-size: 12px; color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
.mini { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.mini .h { font-size: 10px; color: var(--muted); text-align: center; }
.mini button { border: 0; background: transparent; padding: 2px 0; font-family: var(--font-mono); font-size: 11px; border-radius: 4px; }
.mini button:hover { background: var(--accent-soft); }
.mini button.has { background: var(--todo-soft); }
.mini button.all { background: var(--done-soft); color: var(--done); }
.mini button.late { background: var(--bad-soft); color: var(--bad); }
.mini button.today { outline: 1.5px solid var(--accent); }
.mini button.sel { background: var(--accent); color: var(--on-accent); }

/* ---------- Việc ---------- */
.plan { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.item { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; padding: 10px; border: 1px solid var(--line); border-radius: 10px; border-left: 4px solid var(--todo); background: var(--surface); }
.item.done { border-left-color: var(--done); }
.item.late { border-left-color: var(--bad); }
.mark { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--muted); display: grid; place-items: center; margin-top: 2px; }
.item.done .mark { background: var(--done); border-color: var(--done); }
.mark svg { width: 13px; height: 13px; stroke: #fff; stroke-width: 3; fill: none; opacity: 0; }
.item.done .mark svg { opacity: 1; }
.it { font-weight: 600; overflow-wrap: anywhere; }
.item.done .it { color: var(--muted); text-decoration: line-through; font-weight: 500; }
.in { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; margin-top: 2px; }
.im { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; font-size: 12px; color: var(--muted); }
.pill { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
.pill.todo { background: var(--todo-soft); color: var(--todo); }
.pill.done { background: var(--done-soft); color: var(--done); }
.pill.late { background: var(--bad-soft); color: var(--bad); }
.pill.moved { background: var(--accent-soft); color: var(--accent); }
.pill.star { background: var(--gold-soft); color: var(--gold); }
.chip { display: inline-block; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); font-size: 12px; }
.chip.goalref { border-color: var(--accent); color: var(--accent); }
.due { font-variant-numeric: tabular-nums; }
.due.late { color: var(--bad); }
.lnk { font-size: 12px; font-weight: 600; text-decoration: none; }
.lnk:hover { text-decoration: underline; }
.empty { color: var(--muted); font-size: 14px; margin: 0; }

.day { display: grid; gap: 12px; position: sticky; top: 12px; }
@media (max-width: 980px) { .day { position: static; } }
.day h2 { font-family: var(--font-display); font-size: 18px; margin: 0; }
.day .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
.fixed-list { display: grid; gap: 4px; }
.fixed-list h3, .backlog h3 { font-size: 13px; margin: 0; font-weight: 600; }
.fixed-list h3 { color: var(--fixed-ink); }
.backlog { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 6px; }
.backlog h3 { color: var(--bad); }

.lhead { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.lhead h2 { font-family: var(--font-display); font-size: 18px; margin: 0 auto 0 0; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.filters button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13px; }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.filters button b { font-family: var(--font-mono); font-weight: 500; margin-left: 4px; }
.group { display: grid; gap: 8px; margin-top: 14px; }
.group h3 { font-family: var(--font-display); font-size: 14px; margin: 0; display: flex; gap: 8px; align-items: center; }
.group h3 .n { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-weight: 500; }

/* ---------- Mục tiêu ---------- */
.goals { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
.goal { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; background: var(--surface); display: grid; gap: 8px; border-top: 4px solid var(--accent); }
.goal.done { border-top-color: var(--done); }
.goal .gh { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.goal .gt { font-family: var(--font-display); font-weight: 600; font-size: 16px; overflow-wrap: anywhere; }
.goal .gp { font-size: 12px; color: var(--muted); white-space: nowrap; }
.goal .count { font-size: 13px; color: var(--muted); }
.goal .count b { font-family: var(--font-mono); color: var(--ink); font-weight: 500; }
.goal .gm { font-size: 12px; color: var(--gold); font-weight: 600; }
.ghead { font-family: var(--font-display); font-size: 15px; margin: 16px 0 8px; }
.ghead:first-child { margin-top: 0; }

/* ---------- Kho thành quả ---------- */
.trophy-sum { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 4px; }
.tsum { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; min-width: 130px; }
.tsum b { display: block; font-family: var(--font-mono); font-size: 20px; font-weight: 500; color: var(--accent); }
.tsum span { font-size: 12px; color: var(--muted); }
.tmonth { margin-top: 16px; }
.tmonth h3 { font-family: var(--font-display); font-size: 15px; margin: 0 0 8px; display: flex; gap: 8px; align-items: baseline; }
.tmonth h3 span { font-family: var(--font-body); font-size: 12px; color: var(--muted); font-weight: 400; }
.tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.tcard { border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: var(--surface); display: grid; gap: 6px; align-content: start; border-top: 3px solid var(--done); }
.tcard .tt { font-weight: 600; overflow-wrap: anywhere; }
.tcard .tm2 { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tcard .open { justify-self: start; display: inline-flex; gap: 6px; align-items: center; font-size: 13px; font-weight: 600; text-decoration: none; padding: 4px 10px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); }
.tcard .open:hover { text-decoration: underline; }
footer { font-size: 12px; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .cell, .wcol, .btn, .rchip { transition: border-color .15s, background-color .15s; } }
</style>
</head>
<body>
<header class="hero">
  <div class="hero-photo" role="img" aria-label="Ảnh thầy Kiên và các lớp học"></div>
  <canvas id="helix" aria-hidden="true"></canvas>
  <div class="hero-in">
    <div class="brandline">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 48 48"><path d="M10 25l8 8 17-18" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M34 14c5-2 9 0 9 0s-1 6-6 7.5c-3.6 1.1-6-.8-6-.8s-.4-5.2 3-6.7z" fill="#f3d77e"/></svg>
      </div>
      <div>
        <h1>Kế hoạch <em>công việc</em></h1>
        <div class="who">Phạm Minh Kiên · Giáo viên Sinh học</div>
      </div>
    </div>
    <div class="today" id="todayLine"></div>
    <div class="stats" id="stats" aria-label="Tóm tắt"></div>
  </div>
</header>

<div class="wrap">
  <section class="road" id="road" aria-label="Lộ trình"></section>

  <div class="tabs" role="group" aria-label="Chế độ xem">
    <button type="button" data-view="month" aria-pressed="true">Lịch tháng</button>
    <button type="button" data-view="week" aria-pressed="false">Tuần</button>
    <button type="button" data-view="year" aria-pressed="false">Năm</button>
    <button type="button" data-view="list" aria-pressed="false">Danh sách việc</button>
    <button type="button" data-view="goals" aria-pressed="false">Mục tiêu</button>
    <button type="button" data-view="trophy" aria-pressed="false">Kho thành quả</button>
  </div>

  <section class="remind" id="remind" aria-label="Lời nhắc"></section>

  <div class="navbar" id="navbar">
    <button type="button" class="btn icon" id="prev" aria-label="Kỳ trước">‹</button>
    <button type="button" class="btn icon" id="next" aria-label="Kỳ sau">›</button>
    <button type="button" class="btn" id="today">Hôm nay</button>
    <div class="period" id="period" aria-live="polite"></div>
  </div>

  <div class="layout" id="layout">
    <section class="card" id="cal" aria-label="Lịch"></section>
    <aside class="card day" id="day" aria-label="Kế hoạch ngày đã chọn"></aside>
  </div>
  <section class="card" id="list" aria-label="Danh sách việc" hidden></section>
  <section class="card" id="goals" aria-label="Mục tiêu" hidden></section>
  <section class="card" id="trophy" aria-label="Kho thành quả" hidden></section>
  <footer id="foot"></footer>
</div>

<script>
(function () {
  "use strict";
  var CATS = ["Giảng dạy", "Học tập", "Dự án", "Tài liệu", "Cá nhân", "Khác"];
  var DOW = ["Thứ Hai", "Thứ Ba", "Thứ Tư", "Thứ Năm", "Thứ Sáu", "Thứ Bảy", "Chủ nhật"];
  var DOW_S = ["T2", "T3", "T4", "T5", "T6", "T7", "CN"];
  var VIEWS = { month: "thang", week: "tuan", year: "nam", list: "danh-sach", goals: "muc-tieu", trophy: "thanh-qua" };
  var FILTERS = [["all", "Tất cả"], ["open", "Chưa xong"], ["star", "Quan trọng"], ["late", "Quá hạn"], ["soon", "Đến hạn 3 ngày tới"], ["moved", "Đã dời hạn"], ["done", "Đã xong"]];
  var MAX_IN_CELL = 3;

  var state = { view: "month", cursor: todayDate(), sel: todayDate(), tasks: [], goals: [], schedule: [], roadmap: [], updatedAt: "", filter: "all", cat: "all", tcat: "all", status: { msg: "Đang tải dữ liệu…", err: false } };

  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function ymd(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function parse(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function todayDate() { var d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function todayStr() { return ymd(todayDate()); }
  function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  function mondayOf(d) { return addDays(d, -((d.getDay() + 6) % 7)); }
  function dowIndex(d) { return (d.getDay() + 6) % 7; }
  function dm(d) { return pad(d.getDate()) + "/" + pad(d.getMonth() + 1); }
  function dmy(d) { return dm(d) + "/" + d.getFullYear(); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function daysLeft(ds) { return Math.round((parse(ds) - todayDate()) / 86400000); }
  function isDate(s) { return typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s); }
  function isTime(s) { return typeof s === "string" && /^\d{2}:\d{2}$/.test(s); }
  function safeUrl(u) { return typeof u === "string" && /^https?:\/\//i.test(u) ? u : ""; }
  function doneDay(t) { if (t.doneAt) { var d = new Date(t.doneAt); if (!isNaN(d)) return ymd(d); } return t.date; }

  function isLate(t) { return t.status !== "done" && t.date < todayStr(); }
  function isSoon(t) { var n = daysLeft(t.date); return t.status !== "done" && n >= 0 && n <= 3; }
  function isMoved(t) { return t.postponed > 0 || (!!t.originalDate && t.originalDate !== t.date); }
  function vis(t) { return t.status === "done" ? "done" : isLate(t) ? "late" : "todo"; }
  function byDeadline(a, b) {
    if (a.date !== b.date) return a.date < b.date ? -1 : 1;
    if (a.important !== b.important) return a.important ? -1 : 1;
    var ta = a.time || "99:99", tb = b.time || "99:99";
    if (ta !== tb) return ta < tb ? -1 : 1;
    return String(a.createdAt).localeCompare(String(b.createdAt));
  }
  function byImportantThenDeadline(a, b) { if (a.important !== b.important) return a.important ? -1 : 1; return byDeadline(a, b); }
  function tasksOn(ds) { return state.tasks.filter(function (t) { return t.date === ds; }).sort(byDeadline); }
  function fixedOn(d) { var n = dowIndex(d) + 1, k = ymd(d); return state.schedule.filter(function (s) { return s.days.indexOf(n) >= 0 && (!s.from || k >= s.from) && (!s.until || k <= s.until); }); }
  function fixedState(s, k) { return s.cancelled.indexOf(k) >= 0 ? "cancel" : s.done.indexOf(k) >= 0 ? "done" : ""; }
  function fixedItem(s, k) { var st = fixedState(s, k); return '<span class="fxb' + (st ? " off" : "") + '">' + fixedWhen(s) + " · " + esc(s.label) + (st ? '<span class="ofl">' + (st === "cancel" ? "Đã huỷ" : "Đã xong") + "</span>" : "") + "</span>"; }
  function fixedWhen(s) { return s.start ? '<span class="tm">' + esc(s.start + (s.end ? "–" + s.end : "")) + "</span>" : esc(s.slot || ""); }
  function dayState(list) {
    if (!list.length) return "";
    if (list.every(function (t) { return t.status === "done"; })) return "all";
    return list.some(isLate) ? "late" : "has";
  }
  function dueText(t) {
    if (t.status === "done") return t.doneAt ? "Xong ngày " + dm(new Date(t.doneAt)) : "Đã xong";
    var n = daysLeft(t.date);
    if (n < 0) return "Trễ " + (-n) + " ngày";
    if (n === 0) return "Hạn hôm nay";
    if (n === 1) return "Hạn ngày mai";
    return "Còn " + n + " ngày";
  }
  function goalById(id) { for (var i = 0; i < state.goals.length; i++) if (state.goals[i].id === id) return state.goals[i]; return null; }
  function msById(id) { for (var i = 0; i < state.roadmap.length; i++) if (state.roadmap[i].id === id) return state.roadmap[i]; return null; }

  /* ---------- Banner ---------- */
  function renderHero() {
    var t = todayDate(), open = state.tasks.filter(function (x) { return x.status !== "done"; });
    document.getElementById("todayLine").textContent = "Hôm nay: " + DOW[dowIndex(t)] + ", " + dmy(t);
    var todayN = state.tasks.filter(function (x) { return x.date === todayStr(); });
    var m0 = ymd(new Date(t.getFullYear(), t.getMonth(), 1)), m1 = ymd(new Date(t.getFullYear(), t.getMonth() + 1, 0));
    var monthT = state.tasks.filter(function (x) { return x.date >= m0 && x.date <= m1; });
    document.getElementById("stats").innerHTML =
      '<div class="stat"><b>' + todayN.filter(function (x) { return x.status === "done"; }).length + "/" + todayN.length + "</b><span>Việc hôm nay đã xong</span></div>" +
      '<div class="stat"><b>' + open.filter(isLate).length + "</b><span>Quá hạn</span></div>" +
      '<div class="stat"><b>' + monthT.filter(function (x) { return x.status === "done"; }).length + "/" + monthT.length + "</b><span>Việc tháng này đã xong</span></div>";
  }

  /* ---------- Lộ trình ---------- */
  var CHECK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';
  function renderRoad() {
    var el = document.getElementById("road");
    if (!state.roadmap.length) { el.hidden = true; return; }
    el.hidden = false;
    var last = state.roadmap.length - 1;
    el.innerHTML = '<h2>Lộ trình <span>Từ việc hôm nay đến đích lớn</span></h2><ol class="track">' + state.roadmap.map(function (m, i) {
      var cls = m.status + (i === last && m.status !== "done" ? " dream" : "");
      var gcount = state.goals.filter(function (g) { return g.milestone === m.id && g.status !== "done"; }).length;
      var label = m.status === "done" ? "Đã qua" : m.status === "current" ? "Đang ở đây" : "Phía trước";
      return '<li class="ms ' + cls + '" aria-label="' + esc(m.title) + ", " + label + '"><span class="dot">' + (m.status === "done" ? CHECK : "") + "</span>" +
        '<span class="mt">' + esc(m.title) + "</span>" + (m.when ? '<span class="mw">' + esc(m.when) + "</span>" : "") +
        (gcount ? '<span class="mg">' + gcount + " mục tiêu đang theo đuổi</span>" : "") + "</li>";
    }).join("") + "</ol>";
  }

  /* ---------- Lời nhắc ---------- */
  function renderRemind() {
    var open = state.tasks.filter(function (t) { return t.status !== "done"; });
    var late = open.filter(isLate).length;
    var today = open.filter(function (t) { return t.date === todayStr(); }).length;
    var soon = open.filter(isSoon).length;
    var star = open.filter(function (t) { return t.important; }).length;
    var html = '<span class="lbl">Lời nhắc</span>';
    if (late) html += '<button type="button" class="rchip bad" data-act="filter" data-f="late">Quá hạn <b>' + late + "</b></button>";
    if (today) html += '<button type="button" class="rchip todo" data-act="filter" data-f="soon">Hạn hôm nay <b>' + today + "</b></button>";
    if (soon - today > 0) html += '<button type="button" class="rchip todo" data-act="filter" data-f="soon">3 ngày tới <b>' + (soon - today) + "</b></button>";
    if (star) html += '<button type="button" class="rchip star" data-act="filter" data-f="star">★ Quan trọng chưa xong <b>' + star + "</b></button>";
    if (!late && !soon && !star) html += '<span class="calm">' + (state.tasks.length ? (open.length ? "Không có việc nào sắp đến hạn." : "Mọi việc đã xong.") : "Chưa có việc nào. Thầy giao đầu việc cho Claude, việc sẽ hiện ở đây.") + "</span>";
    html += '<span class="status' + (state.status.err ? " err" : "") + '" role="status">' + esc(state.status.msg) + "</span>";
    document.getElementById("remind").innerHTML = html;
  }

  /* ---------- Lịch ---------- */
  function evHTML(t) { return '<span class="ev ' + vis(t) + '">' + (t.important ? '<span class="st" aria-label="Quan trọng">★</span>' : "") + (t.time ? '<span class="tm">' + esc(t.time) + "</span>" : "") + esc(t.title) + "</span>"; }
  function fixedTag(d) { var k = ymd(d); return fixedOn(d).map(function (s) { return '<span class="fx' + (fixedState(s, k) ? " off" : "") + '">' + esc(s.label) + "</span>"; }).join(""); }
  function legend() { return '<div class="legend"><span class="lg-todo">Chưa xong</span><span class="lg-done">Đã xong</span><span class="lg-late">Quá hạn</span><span class="lg-fix">Lịch cố định</span><span class="lg-star"><span class="st">★</span>Quan trọng</span></div>'; }

  function renderMonth() {
    var c = state.cursor, first = new Date(c.getFullYear(), c.getMonth(), 1), start = mondayOf(first), t0 = todayStr(), sel = ymd(state.sel);
    var html = '<div class="grid7">' + DOW_S.map(function (d) { return '<div class="dow">' + d + "</div>"; }).join("");
    for (var i = 0; i < 42; i++) {
      var day = addDays(start, i);
      if (i >= 35 && day.getMonth() !== c.getMonth()) break;
      var ds = ymd(day), list = tasksOn(ds);
      html += '<button type="button" class="cell' + (day.getMonth() !== c.getMonth() ? " out" : "") + (ds === t0 ? " today" : "") + (ds === sel ? " sel" : "") + '" data-act="pick" data-date="' + ds + '" aria-pressed="' + (ds === sel) + '" aria-label="' + DOW[dowIndex(day)] + " " + dm(day) + ", " + (list.length ? list.length + " việc" : "chưa có việc") + '">' +
        '<span class="d"><b>' + day.getDate() + "</b></span>" + fixedTag(day) + list.slice(0, MAX_IN_CELL).map(evHTML).join("") +
        (list.length > MAX_IN_CELL ? '<span class="more">+' + (list.length - MAX_IN_CELL) + " việc nữa</span>" : "") +
        '<span class="dots">' + list.map(function (t) { return '<i class="' + vis(t) + '"></i>'; }).join("") + "</span></button>";
    }
    return html + "</div>" + legend();
  }
  function renderWeek() {
    var m = mondayOf(state.cursor), t0 = todayStr(), sel = ymd(state.sel), html = '<div class="week">';
    for (var i = 0; i < 7; i++) {
      var day = addDays(m, i), ds = ymd(day), list = tasksOn(ds);
      var fx = fixedOn(day).map(function (s) { return fixedItem(s, ds); }).join("");
      html += '<button type="button" class="wcol' + (ds === t0 ? " today" : "") + (ds === sel ? " sel" : "") + '" data-act="pick" data-date="' + ds + '" aria-pressed="' + (ds === sel) + '">' +
        '<span class="wh"><b>' + DOW[i] + "</b><span>" + dm(day) + "</span></span>" + fx + (list.length ? list.map(evHTML).join("") : (fx ? "" : '<span class="empty" style="font-size:12px">Trống</span>')) + "</button>";
    }
    return html + "</div>" + legend();
  }

  function renderHeat(y) {
    var counts = {};
    state.tasks.forEach(function (t) { if (t.status === "done") { var d = doneDay(t); if (d.slice(0, 4) === String(y)) counts[d] = (counts[d] || 0) + 1; } });
    var first = new Date(y, 0, 1), last = new Date(y, 11, 31), start = mondayOf(first), t0 = todayStr();
    var cells = "", col = 0, lastMonth = -1, totalDone = 0, activeDays = 0, best = 0;
    for (var d = start; d <= last; d = addDays(d, 7)) {
      col++;
      var mStart = null;
      for (var k = 0; k < 7; k++) { var dd = addDays(d, k); if (dd.getFullYear() === y && dd.getDate() === 1) mStart = dd.getMonth(); }
      if (col === 1 && first.getDate() === 1 && mStart === null) mStart = 0;
      if (mStart !== null && mStart !== lastMonth) { cells += '<span class="ml" style="grid-column:' + col + '">Th' + (mStart + 1) + "</span>"; lastMonth = mStart; }
      for (var r = 0; r < 7; r++) {
        var day = addDays(d, r), ds = ymd(day);
        var pos = 'style="grid-column:' + col + ";grid-row:" + (r + 2) + '"';
        if (day.getFullYear() !== y) { cells += '<i class="pad" ' + pos + "></i>"; continue; }
        var n = counts[ds] || 0; if (n) { totalDone += n; activeDays++; best = Math.max(best, n); }
        var lv = n === 0 ? "" : n === 1 ? "l1" : n === 2 ? "l2" : n <= 4 ? "l3" : "l4";
        cells += '<i class="' + lv + (ds === t0 ? " today" : "") + '" ' + pos + ' title="' + dm(day) + ": " + n + ' việc xong"></i>';
      }
    }
    var days = '<div class="heat-days"><span></span>' + DOW_S.map(function (x, i) { return "<span>" + (i % 2 === 0 ? x : "") + "</span>"; }).join("") + "</div>";
    return '<h2 class="sec-h">Nhịp làm việc năm ' + y + " <span>Mỗi ô là một ngày, càng nhiều việc xong màu càng đậm</span></h2>" +
      '<div class="heat-row">' + days + '<div class="heat-wrap"><div class="heat" role="img" aria-label="Số việc xong mỗi ngày trong năm ' + y + '">' + cells + "</div></div></div>" +
      '<div class="heat-legend">Ít <i style="background:var(--heat0)"></i><i style="background:var(--heat1)"></i><i style="background:var(--heat2)"></i><i style="background:var(--heat3)"></i><i style="background:var(--heat4)"></i> Nhiều</div>' +
      '<p class="heat-note">Năm ' + y + ": <b>" + totalDone + "</b> việc đã xong trong <b>" + activeDays + "</b> ngày" + (best ? ", ngày nhiều nhất <b>" + best + "</b> việc" : "") + ".</p>";
  }
  function renderYear() {
    var y = state.cursor.getFullYear(), t0 = todayStr(), sel = ymd(state.sel), html = renderHeat(y) + '<div class="year">';
    for (var mo = 0; mo < 12; mo++) {
      var first = new Date(y, mo, 1), last = new Date(y, mo + 1, 0), cnt = 0;
      var cells = DOW_S.map(function (d) { return '<span class="h">' + d + "</span>"; }).join("");
      for (var b = 0; b < dowIndex(first); b++) cells += "<span></span>";
      for (var d = 1; d <= last.getDate(); d++) {
        var ds = ymd(new Date(y, mo, d)), list = tasksOn(ds); cnt += list.length;
        cells += '<button type="button" class="' + [dayState(list), ds === t0 ? "today" : "", ds === sel ? "sel" : ""].join(" ").trim() + '" data-act="pick" data-date="' + ds + '" aria-label="' + dm(new Date(y, mo, d)) + ", " + list.length + ' việc">' + d + "</button>";
      }
      html += '<div class="mcard"><button type="button" class="mh" data-act="open-month" data-month="' + mo + '">Tháng ' + (mo + 1) + "<span>" + cnt + ' việc</span></button><div class="mini">' + cells + "</div></div>";
    }
    return html + "</div>";
  }

  var MARK = '<span class="mark" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5"/></svg></span>';
  function itemHTML(t, showDate) {
    var v = vis(t), g = t.goal ? goalById(t.goal) : null;
    var when = showDate ? DOW_S[dowIndex(parse(t.date))] + " " + dm(parse(t.date)) + (t.time ? " · " + t.time : "") : (t.time || "Cả ngày");
    var label = v === "done" ? "Đã xong" : v === "late" ? "Quá hạn" : "Chưa xong";
    var moved = "";
    if (isMoved(t)) { var n = t.postponed > 0 ? t.postponed : 1; moved = '<span class="pill moved">Dời hạn ' + n + " lần" + (t.originalDate ? ", hạn đầu " + esc(dm(parse(t.originalDate))) : "") + "</span>"; }
    return '<li class="item ' + v + '">' + MARK +
      '<div><div class="it">' + (t.important ? '<span class="st" aria-label="Quan trọng">★</span>' : "") + esc(t.title) + "</div>" + (t.note ? '<div class="in">' + esc(t.note) + "</div>" : "") +
      '<div class="im"><span class="pill ' + v + '">' + label + "</span>" + (t.important ? '<span class="pill star">Quan trọng</span>' : "") + moved +
      '<span class="due' + (v === "late" ? " late" : "") + '">' + esc(when) + " · " + esc(dueText(t)) + "</span>" +
      '<span class="chip">' + esc(t.category) + "</span>" + (g ? '<span class="chip goalref">Mục tiêu: ' + esc(g.title) + "</span>" : "") +
      (t.link ? '<a class="lnk" href="' + esc(t.link) + '" target="_blank" rel="noopener">Mở sản phẩm ↗</a>' : "") + "</div></div></li>";
  }
  function renderDay() {
    var ds = ymd(state.sel), list = tasksOn(ds), done = list.filter(function (t) { return t.status === "done"; }).length;
    var html = "<div><h2>" + DOW[dowIndex(state.sel)] + ", " + dmy(state.sel) + "</h2>" +
      '<div class="sub">' + (ds === todayStr() ? "Hôm nay · " : "") + (list.length ? done + "/" + list.length + " việc đã xong" : "Chưa có việc") + "</div></div>";
    var fx = fixedOn(state.sel);
    if (fx.length) html += '<div class="fixed-list"><h3>Lịch cố định</h3>' + fx.map(function (s) { return fixedItem(s, ds); }).join("") + "</div>";
    html += list.length ? '<ul class="plan">' + list.map(function (t) { return itemHTML(t, false); }).join("") + "</ul>" : '<p class="empty">Ngày này chưa có việc.</p>';
    if (ds === todayStr()) {
      var back = state.tasks.filter(isLate).sort(byImportantThenDeadline);
      if (back.length) html += '<div class="backlog"><h3>Việc quá hạn từ trước (' + back.length + ')</h3><ul class="plan">' + back.map(function (t) { return itemHTML(t, true); }).join("") + "</ul></div>";
    }
    return html;
  }

  /* ---------- Danh sách ---------- */
  function matchFilter(t, f) {
    if (f === "all") return true;
    if (f === "open") return t.status !== "done";
    if (f === "star") return t.important && t.status !== "done";
    if (f === "late") return isLate(t);
    if (f === "soon") return isSoon(t);
    if (f === "moved") return isMoved(t) && t.status !== "done";
    return t.status === "done";
  }
  function catFilters(key, cur) {
    return '<div class="filters" role="group" aria-label="Lọc theo nhóm việc"><button type="button" data-act="' + key + '" data-c="all" aria-pressed="' + (cur === "all") + '">Mọi nhóm</button>' +
      CATS.map(function (c) { return '<button type="button" data-act="' + key + '" data-c="' + esc(c) + '" aria-pressed="' + (cur === c) + '">' + esc(c) + "</button>"; }).join("") + "</div>";
  }
  function renderList() {
    var base = state.tasks.filter(function (t) { return state.cat === "all" || t.category === state.cat; });
    var counts = {}; FILTERS.forEach(function (f) { counts[f[0]] = base.filter(function (t) { return matchFilter(t, f[0]); }).length; });
    var html = '<div class="lhead"><h2>Danh sách việc</h2>' + catFilters("cat", state.cat) + "</div>" +
      '<div class="filters" role="group" aria-label="Lọc theo trạng thái">' + FILTERS.map(function (f) { return '<button type="button" data-act="filter" data-f="' + f[0] + '" aria-pressed="' + (state.filter === f[0]) + '">' + f[1] + "<b>" + counts[f[0]] + "</b></button>"; }).join("") + "</div>";
    if (!base.length) return html + '<p class="empty" style="margin-top:14px">Chưa có việc nào.</p>';
    var groups = state.filter === "all" ? [
      ["Quá hạn", base.filter(isLate)],
      ["Chưa xong", base.filter(function (t) { return t.status !== "done" && !isLate(t); })],
      ["Đã xong", base.filter(function (t) { return t.status === "done"; })]
    ] : [[FILTERS.filter(function (f) { return f[0] === state.filter; })[0][1], base.filter(function (t) { return matchFilter(t, state.filter); })]];
    groups.forEach(function (g) {
      if (!g[1].length && state.filter === "all") return;
      var items = g[1].slice().sort(byImportantThenDeadline);
      if (g[0] === "Đã xong") items.sort(byDeadline).reverse();
      html += '<section class="group"><h3>' + esc(g[0]) + ' <span class="n">' + items.length + "</span></h3>" +
        (items.length ? '<ul class="plan">' + items.map(function (t) { return itemHTML(t, true); }).join("") + "</ul>" : '<p class="empty">Không có việc nào.</p>') + "</section>";
    });
    return html;
  }

  /* ---------- Mục tiêu ---------- */
  function periodText(g) {
    if (/^\d{4}-\d{2}$/.test(g.period)) { var p = g.period.split("-"); return "Tháng " + (+p[1]) + "/" + p[0]; }
    if (isDate(g.period)) { var m = mondayOf(parse(g.period)); return "Tuần " + dm(m) + " – " + dm(addDays(m, 6)); }
    return g.period || "";
  }
  function goalCurrent(g) {
    var t = todayDate();
    if (g.scope === "month") return g.period === t.getFullYear() + "-" + pad(t.getMonth() + 1);
    if (g.scope === "week" && isDate(g.period)) return ymd(mondayOf(parse(g.period))) === ymd(mondayOf(t));
    return false;
  }
  function goalCard(g) {
    var tasks = state.tasks.filter(function (t) { return t.goal === g.id; }).sort(byDeadline);
    var done = tasks.filter(function (t) { return t.status === "done"; }).length;
    var gdone = g.status === "done", ms = g.milestone ? msById(g.milestone) : null;
    return '<article class="goal' + (gdone ? " done" : "") + '"><div class="gh"><span class="gt">' + esc(g.title) + '</span><span class="gp">' + esc(periodText(g)) + "</span></div>" +
      (ms ? '<div class="gm">Phục vụ mốc: ' + esc(ms.title) + "</div>" : "") + (g.note ? '<div class="in">' + esc(g.note) + "</div>" : "") +
      '<div class="count"><span class="pill ' + (gdone ? "done" : "todo") + '">' + (gdone ? "Đã đạt" : "Đang theo đuổi") + "</span> · <b>" + done + "/" + tasks.length + "</b> việc gắn với mục tiêu đã xong</div>" +
      (tasks.length ? '<ul class="plan">' + tasks.map(function (t) { return itemHTML(t, true); }).join("") + "</ul>" : '<p class="empty">Chưa có việc nào gắn với mục tiêu này.</p>') + "</article>";
  }
  function renderGoals() {
    if (!state.goals.length) return '<p class="empty">Chưa có mục tiêu nào. Thầy nói mục tiêu tuần hoặc tháng với Claude, mục tiêu sẽ hiện ở đây cùng các việc gắn với nó.</p>';
    var cur = state.goals.filter(goalCurrent), other = state.goals.filter(function (g) { return !goalCurrent(g); });
    other.sort(function (a, b) { return String(b.period).localeCompare(String(a.period)); });
    var html = "";
    if (cur.length) html += '<h2 class="ghead">Mục tiêu tuần này và tháng này</h2><div class="goals">' + cur.map(goalCard).join("") + "</div>";
    if (other.length) html += '<h2 class="ghead">Các mục tiêu khác</h2><div class="goals">' + other.map(goalCard).join("") + "</div>";
    return html;
  }

  /* ---------- Kho thành quả ---------- */
  function renderTrophy() {
    var all = state.tasks.filter(function (t) { return t.status === "done"; });
    var done = all.filter(function (t) { return state.tcat === "all" || t.category === state.tcat; });
    var withLink = all.filter(function (t) { return t.link; }).length;
    var y = todayDate().getFullYear(), thisYear = all.filter(function (t) { return doneDay(t).slice(0, 4) === String(y); }).length;
    var html = '<div class="lhead"><h2>Kho thành quả</h2>' + catFilters("tcat", state.tcat) + "</div>" +
      '<div class="trophy-sum"><div class="tsum"><b>' + all.length + '</b><span>Việc đã hoàn thành</span></div><div class="tsum"><b>' + thisYear + "</b><span>Trong năm " + y + '</span></div><div class="tsum"><b>' + withLink + "</b><span>Có sản phẩm đính kèm</span></div></div>";
    if (!done.length) return html + '<p class="empty" style="margin-top:14px">' + (all.length ? "Nhóm này chưa có việc nào hoàn thành." : "Chưa có việc nào hoàn thành. Mỗi việc xong sẽ được lưu ở đây, kèm link sản phẩm nếu có.") + "</p>";
    var byMonth = {};
    done.forEach(function (t) { var k = doneDay(t).slice(0, 7); (byMonth[k] = byMonth[k] || []).push(t); });
    Object.keys(byMonth).sort().reverse().forEach(function (k) {
      var list = byMonth[k].sort(function (a, b) { return doneDay(b).localeCompare(doneDay(a)); }), p = k.split("-");
      html += '<section class="tmonth"><h3>Tháng ' + (+p[1]) + "/" + p[0] + " <span>" + list.length + ' việc</span></h3><div class="tgrid">' + list.map(function (t) {
        return '<article class="tcard"><div class="tt">' + (t.important ? '<span class="st">★</span>' : "") + esc(t.title) + "</div>" +
          '<div class="tm2"><span>Xong ngày ' + esc(dm(parse(doneDay(t)))) + '</span><span class="chip">' + esc(t.category) + "</span></div>" +
          (t.note ? '<div class="in">' + esc(t.note) + "</div>" : "") +
          (t.link ? '<a class="open" href="' + esc(t.link) + '" target="_blank" rel="noopener">Mở sản phẩm ↗</a>' : "") + "</article>";
      }).join("") + "</div></section>";
    });
    return html;
  }

  /* ---------- Vẽ lại ---------- */
  function periodLabel() {
    var c = state.cursor;
    if (state.view === "month") return "Tháng " + (c.getMonth() + 1) + "/" + c.getFullYear();
    if (state.view === "week") { var m = mondayOf(c), s = addDays(m, 6); return "Tuần " + dm(m) + " – " + dmy(s); }
    return "Năm " + c.getFullYear();
  }
  function render() {
    document.querySelectorAll(".tabs button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.view === state.view)); });
    renderHero(); renderRoad(); renderRemind();
    var cal = state.view === "month" || state.view === "week" || state.view === "year";
    document.getElementById("navbar").hidden = !cal;
    document.getElementById("layout").hidden = !cal;
    ["list", "goals", "trophy"].forEach(function (k) { document.getElementById(k).hidden = state.view !== k; });
    if (state.view === "list") document.getElementById("list").innerHTML = renderList();
    else if (state.view === "goals") document.getElementById("goals").innerHTML = renderGoals();
    else if (state.view === "trophy") document.getElementById("trophy").innerHTML = renderTrophy();
    else {
      document.getElementById("period").textContent = periodLabel();
      document.getElementById("cal").innerHTML = state.view === "month" ? renderMonth() : state.view === "week" ? renderWeek() : renderYear();
      document.getElementById("day").innerHTML = renderDay();
    }
    var up = state.updatedAt ? new Date(state.updatedAt) : null;
    document.getElementById("foot").textContent = up && !isNaN(up) ? "Claude cập nhật kế hoạch lần cuối lúc " + pad(up.getHours()) + ":" + pad(up.getMinutes()) + " ngày " + dmy(up) + "." : "";
  }
  function setView(v, fromHash) {
    if (!VIEWS[v]) return;
    state.view = v;
    if (v === "month") state.cursor = new Date(state.sel.getFullYear(), state.sel.getMonth(), 1);
    else if (v === "week") state.cursor = new Date(state.sel.getFullYear(), state.sel.getMonth(), state.sel.getDate());
    else if (v === "year") state.cursor = new Date(state.sel.getFullYear(), 0, 1);
    if (!fromHash) { try { history.replaceState(null, "", "#" + VIEWS[v]); } catch (e) { /* bỏ qua */ } }
    render();
  }
  function viewFromHash() { var h = (location.hash || "").slice(1); for (var k in VIEWS) if (VIEWS[k] === h) return k; return null; }
  function step(dir) {
    var c = state.cursor;
    if (state.view === "month") state.cursor = new Date(c.getFullYear(), c.getMonth() + dir, 1);
    else if (state.view === "week") { state.cursor = addDays(c, 7 * dir); state.sel = addDays(state.sel, 7 * dir); }
    else state.cursor = new Date(c.getFullYear() + dir, 0, 1);
    render();
  }

  document.addEventListener("click", function (ev) {
    var el = ev.target.closest("[data-act]"); if (!el) return;
    var act = el.dataset.act;
    if (act === "pick") {
      state.sel = parse(el.dataset.date);
      if (state.view === "month" && (state.sel.getMonth() !== state.cursor.getMonth() || state.sel.getFullYear() !== state.cursor.getFullYear())) state.cursor = new Date(state.sel.getFullYear(), state.sel.getMonth(), 1);
      render();
      if (window.matchMedia && window.matchMedia("(max-width: 980px)").matches) { try { document.getElementById("day").scrollIntoView({ behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" }); } catch (e) { /* bỏ qua */ } }
    }
    else if (act === "filter") { state.filter = el.dataset.f; setView("list"); }
    else if (act === "cat") { state.cat = el.dataset.c; render(); }
    else if (act === "tcat") { state.tcat = el.dataset.c; render(); }
    else if (act === "open-month") { state.cursor = new Date(state.cursor.getFullYear(), +el.dataset.month, 1); state.view = "month"; try { history.replaceState(null, "", "#thang"); } catch (e) { /* bỏ qua */ } render(); }
  });
  document.querySelector(".tabs").addEventListener("click", function (ev) { var b = ev.target.closest("button[data-view]"); if (!b) return; if (b.dataset.view === "list") state.filter = "all"; setView(b.dataset.view); });
  document.getElementById("prev").addEventListener("click", function () { step(-1); });
  document.getElementById("next").addEventListener("click", function () { step(1); });
  document.getElementById("today").addEventListener("click", function () { state.sel = todayDate(); setView(state.view); });
  window.addEventListener("hashchange", function () { var v = viewFromHash(); if (v && v !== state.view) setView(v, true); });

  /* ---------- Chuỗi xoắn kép trang trí trên banner ---------- */
  (function helix() {
    var cv = document.getElementById("helix"); if (!cv || !cv.getContext) return;
    var ctx = cv.getContext("2d"), still = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches, phase = 0, raf = 0;
    function size() { var r = cv.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2); cv.width = Math.max(1, r.width * dpr); cv.height = Math.max(1, r.height * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); draw(); }
    function draw() {
      var w = cv.width / Math.min(window.devicePixelRatio || 1, 2), h = cv.height / Math.min(window.devicePixelRatio || 1, 2);
      ctx.clearRect(0, 0, w, h);
      var mid = h * 0.5, amp = Math.min(h * 0.28, 70), wave = 210, stepX = 22;
      for (var x = -stepX; x < w + stepX; x += stepX) {
        var a = (x / wave) * Math.PI * 2 + phase, y1 = mid + Math.sin(a) * amp, y2 = mid - Math.sin(a) * amp, depth = (Math.cos(a) + 1) / 2;
        ctx.strokeStyle = "rgba(255,255,255," + (0.10 + 0.18 * depth) + ")"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(x, y1); ctx.lineTo(x, y2); ctx.stroke();
        ctx.fillStyle = "rgba(243,215,126," + (0.35 + 0.5 * depth) + ")"; ctx.beginPath(); ctx.arc(x, y1, 2.5 + 2 * depth, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "rgba(255,255,255," + (0.35 + 0.5 * (1 - depth)) + ")"; ctx.beginPath(); ctx.arc(x, y2, 2.5 + 2 * (1 - depth), 0, Math.PI * 2); ctx.fill();
      }
    }
    function tick() { phase += 0.006; draw(); raf = requestAnimationFrame(tick); }
    window.addEventListener("resize", size);
    document.addEventListener("visibilitychange", function () { if (still) return; if (document.hidden) cancelAnimationFrame(raf); else { cancelAnimationFrame(raf); tick(); } });
    size(); if (!still) tick();
  })();

  /* ---------- Dữ liệu ---------- */
  function normTask(x, i) {
    x = x || {};
    return {
      id: String(x.id || "t" + i), title: x.title || "(chưa đặt tên)",
      date: isDate(x.date) ? x.date : todayStr(),
      originalDate: isDate(x.originalDate) ? x.originalDate : "",
      postponed: typeof x.postponed === "number" && x.postponed > 0 ? Math.floor(x.postponed) : 0,
      time: isTime(x.time) ? x.time : "",
      category: CATS.indexOf(x.category) >= 0 ? x.category : "Khác",
      status: x.status === "done" ? "done" : "todo",
      important: x.important === true,
      goal: typeof x.goal === "string" ? x.goal : "",
      link: safeUrl(x.link),
      doneAt: x.doneAt || null, note: x.note || "", createdAt: x.createdAt || ""
    };
  }
  function normGoal(x, i) {
    x = x || {};
    return { id: String(x.id || "g" + i), title: x.title || "(chưa đặt tên)", scope: x.scope === "week" ? "week" : "month", period: typeof x.period === "string" ? x.period : "", status: x.status === "done" ? "done" : "todo", milestone: typeof x.milestone === "string" ? x.milestone : "", note: x.note || "" };
  }
  function normFixed(x) {
    x = x || {};
    var days = Array.isArray(x.days) ? x.days.filter(function (d) { return d >= 1 && d <= 7; }) : [];
    return { days: days, label: x.label || "Lịch cố định", start: isTime(x.start) ? x.start : "", end: isTime(x.end) ? x.end : "", slot: x.slot || "", from: isDate(x.from) ? x.from : "", until: isDate(x.until) ? x.until : "", done: dates(x.done), cancelled: dates(x.cancelled) };
  }
  function dates(v) { return Array.isArray(v) ? v.filter(isDate) : [];
  }
  function isDate(v) { return typeof v === "string" && /^\d{4}-\d{2}-\d{2}$/.test(v); }
  function normMs(x, i) {
    x = x || {};
    return { id: String(x.id || "m" + i), title: x.title || "", when: x.when || "", status: x.status === "done" || x.status === "current" ? x.status : "next" };
  }
  function load() {
    fetch("tasks.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (data) {
        state.tasks = (Array.isArray(data.tasks) ? data.tasks : []).map(normTask);
        state.goals = (Array.isArray(data.goals) ? data.goals : []).map(normGoal);
        state.schedule = (Array.isArray(data.schedule) ? data.schedule : []).map(normFixed).filter(function (s) { return s.days.length; });
        state.roadmap = (Array.isArray(data.roadmap) ? data.roadmap : []).map(normMs).filter(function (m) { return m.title; });
        state.updatedAt = data.updatedAt || "";
        state.status = { msg: "Đã tải kế hoạch", err: false };
        render();
      })
      .catch(function () { state.status = { msg: "Chưa tải được dữ liệu. Tải lại trang để thử lại.", err: true }; render(); });
  }

  var hv = viewFromHash(); if (hv) state.view = hv;
  if (state.view === "month") state.cursor = new Date(state.sel.getFullYear(), state.sel.getMonth(), 1);
  render();
  load();
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") load(); });
})();
</script>
</body>
</html>
